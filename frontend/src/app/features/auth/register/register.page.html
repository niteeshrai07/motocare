<div class="auth-page">
  <app-card title="Create your account" subtitle="Join Motocare today">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="new-password" novalidate>
      <div class="auth-form__field">
        <app-input
          formControlName="name"
          id="register-name"
          label="Full Name"
          type="text"
          placeholder="Jane Doe"
          [required]="true"
          autocomplete="name"
          [error]="nameError"
        />
      </div>

      <div class="auth-form__field">
        <app-input
          formControlName="email"
          id="register-email"
          label="Email"
          type="email"
          placeholder="you@example.com"
          [required]="true"
          autocomplete="email"
          [error]="emailError"
        />
      </div>

      <div class="auth-form__field">
        <app-input
          formControlName="password"
          id="register-password"
          label="Password"
          type="password"
          placeholder="At least 8 characters"
          [required]="true"
          autocomplete="new-password"
          [error]="passwordError"
        />
      </div>

      <div class="auth-form__field">
        <app-input
          formControlName="confirmPassword"
          id="register-confirm-password"
          label="Confirm Password"
          type="password"
          placeholder="••••••••"
          [required]="true"
          autocomplete="new-password"
          [error]="confirmPasswordError"
        />
      </div>

      @if (passwordMismatch) {
        <div class="auth-form__error" role="alert">Passwords do not match</div>
      }

      <div class="auth-form__field">
        <app-input
          formControlName="phone"
          id="register-phone"
          label="Phone Number"
          type="tel"
          placeholder="+919876543210"
          [required]="true"
          autocomplete="tel"
          [error]="phoneError"
        />
      </div>

      <div class="auth-form__field">
        <label class="auth-form__label">I am a</label>
        <div class="auth-form__radio-group" role="radiogroup">
          <label class="auth-form__radio">
            <input
              type="radio"
              id="role-customer"
              name="role"
              formControlName="role"
              value="customer"
              />
            <span>Customer</span>
          </label>
          <label class="auth-form__radio">
            <input
              type="radio"
              id="role-mechanic"
              name="role"
              formControlName="role"
              value="mechanic"
              />
            <span>Mechanic</span>
          </label>
        </div>
        @if (roleError) {
          <div class="auth-form__error" role="alert">{{ roleError }}</div>
        }
      </div>

      @if (serverError()) {
        <div class="auth-form__error" role="alert">{{ serverError() }}</div>
      }

      <div class="auth-form__actions">
        <app-button
          type="submit"
          [disabled]="form.invalid || isSubmitting()"
          [loading]="isSubmitting()"
        >
          Create account
        </app-button>
      </div>
    </form>

    <div class="auth-form__footer">
      <span>Already have an account? </span>
      <a routerLink="/login" class="auth-form__link">Sign in</a>
    </div>
  </app-card>
</div>
