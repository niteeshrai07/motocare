<div class="card">
  @if (title || subtitle) {
    <div class="card__header">
      <h4 class="card__title">{{ title }}</h4>
      @if (subtitle) {
        <p class="card__subtitle">{{ subtitle }}</p>
      }
    </div>
  }
  <div class="card__body">
    <ng-content></ng-content>
  </div>
  <ng-content select="[card-footer]"></ng-content>
</div>
